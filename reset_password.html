{% extends "base.html" %}
{% block title %}Choose new password · StudyFlow{% endblock %}
{% block content %}<div class="auth-page"><section class="auth-card"><p class="eyebrow">ACCOUNT RECOVERY</p><h1>Choose a new <span>password.</span></h1><form method="post" class="auth-form"><label>New password<input type="password" name="password" autocomplete="new-password" minlength="8" required><small>Use at least 8 characters.</small></label><label>Confirm new password<input type="password" name="confirm_password" autocomplete="new-password" minlength="8" required></label><button class="btn btn-primary" type="submit">Update password</button></form></section></div>
<style>.auth-page{min-height:65vh;display:flex;align-items:center;justify-content:center;padding:32px 16px}.auth-card{width:min(100%,520px);background:#fff;border:1px solid #e2eee7;border-radius:24px;padding:clamp(24px,5vw,44px);box-shadow:0 20px 55px #123d2d12}.auth-card h1{font-family:Manrope,sans-serif;font-size:clamp(30px,5vw,42px);line-height:1.15;margin:10px 0}.auth-card h1 span{color:#27835b}.auth-form{display:grid;gap:16px;margin-top:26px}.auth-form label{display:grid;gap:7px;font-weight:600}.auth-form input{width:100%;box-sizing:border-box;border:1px solid #d7e5dc;border-radius:12px;padding:13px 14px;font:inherit}.auth-form small{font-weight:400;color:#6b8175}.auth-form .btn{justify-content:center;border:0;cursor:pointer;font:inherit}</style>{% endblock %}
